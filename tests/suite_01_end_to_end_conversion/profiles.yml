jaffle_shop_athena_migration:
  target: "{{ env_var('DBT_TARGET', 'parse') }}"
  outputs:
    parse:
      type: dlc
      host: offline.invalid
      port: 10009
      engine_name: offline
      resource_group_name: offline
      catalog: DataLakeCatalog
      schema: athena_migration
      auth_mode: AccessKey
      secret_id: offline
      secret_key: offline
      threads: 1

    dev:
      type: dlc
      host: "{{ env_var('DLC_HOST') }}"
      port: "{{ env_var('DLC_PORT', '10009') | int }}"
      engine_name: "{{ env_var('DLC_ENGINE_NAME') }}"
      resource_group_name: "{{ env_var('DLC_RESOURCE_GROUP') }}"
      catalog: "{{ env_var('DLC_CATALOG', 'DataLakeCatalog') }}"
      schema: "{{ env_var('DLC_MIGRATION_SCHEMA', 'athena_migration') }}"
      auth_mode: AccessKey
      secret_id: "{{ env_var('TENCENTCLOUD_SECRET_ID') }}"
      secret_key: "{{ env_var('TENCENTCLOUD_SECRET_KEY') }}"
      transport_mode: "{{ env_var('DLC_TRANSPORT_MODE', 'binary') }}"
      socket_timeout_ms: 600000
      connect_retries: 3
      connect_timeout: 30
      threads: "{{ env_var('DBT_THREADS', '4') | int }}"
